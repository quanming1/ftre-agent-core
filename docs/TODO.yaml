          - tests/test_react_runner_step_hook.py（Step 边界回归）
        external_consumer: E:\ftre（ftre-inbox 监听并贡献 next-step）
        acceptance: Core 每次 LLM Reasoning 前触发 agent/before-reasoning；宿主可追加通用 messages；Core 不依赖 ftre/Inbox；Core 与 ftre 全量质量门禁和 active-steer 集成 smoke 通过

