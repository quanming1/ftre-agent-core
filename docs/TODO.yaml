        title: Core Hook 面终局收敛（Tool 两段 + Stop Decision 改名）
        status: done
        prd: docs/prd/PRD-C3-hook-surface-convergence.md
        prd_status: 已验收
        completion_date: 2026-08-24
        depends_on:
          - C2
        paired_stage: E:\ftre F16
        implementation_boundary: 只修改 Agent Core 的 Hook 契约、Tool/Agent 调用点、Core 测试与发行元数据；不引入 ftre、Cordis 或宿主状态
        modules:
