        acceptance: Core Tool Hook 从四段收敛为 tool/before 与 tool/after；agent/turn-stopping 改为 agent/stop-decision；旧常量、Spec、DTO、调用点和测试清零；默认行为、取消、失败归一化与 ContinueTurn 语义保持不变；pytest、ruff、wheel 和洁净安装验证通过
        tasks:
