          - src/ftre_agent_core/agent/runner/（Tool、LLM、停止决策注入点）
          - tests/（Core Hook 合同与状态机回归）
        acceptance: Core 不再持有 Hook 注册表；ftre 可直接注入 Cordis HookRuntime；Tool、LLM stream、turn-stopping 管线全量测试通过

