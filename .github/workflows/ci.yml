name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # ftre-agent-core 依赖 ftre-llm（C7 协议唯一 Owner，源码在 ftre 主仓
      # packages/ 下，未发布到 PyPI）。ftre 仓库为 public，可直接 checkout；
      # 以 no-deps 注册本发行物，再安装 core 本体即可满足全部依赖约束。
      # 测试运行时 ftre_llm.contracts/events 仅使用标准库，无需其三方依赖。
      - name: Checkout ftre (for ftre-llm)
        uses: actions/checkout@v4
        with:
          repository: quanming1/ftre
          path: ftre

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 全链 --no-deps + 手动装三方依赖：pip 解析 ftre-llm 的依赖时会递归
        # 到 cordis-py（同样未发布 PyPI）导致失败；而测试运行时
        # ftre_llm.contracts/events 与 core 只需 openai/pydantic/标准库。
        run: |
          pip install -e ./ftre/packages/ftre-llm --no-deps
          pip install -e . --no-deps
          pip install openai pydantic pytest pytest-asyncio

      - name: Syntax check
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('src').rglob('*.py')]"

      - name: Run tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_probe_real_model.py
