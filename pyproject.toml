[project]
name = "ftre-agent-core"
version = "0.1.1"
description = "Agent framework core - ReAct Agent, Tool System, LLM Adapters"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "quanming1"}
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ftre_agent_core = ["prompt/templates/*.md", "prompt/templates/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
